# Turbo Kart Grand Prix — second Tripo batch: crowd characters, empty grandstand, more trees, second cloud.
# Run:  tripo batch run tripo-assets-2.yaml --concurrency 3 --retries 1
concurrency: 3
defaults:
  out: ./tripo-out
  params:
    negative_prompt: "realistic, photorealistic, text, letters, logo, watermark, multiple objects, base, ground plane, background"
jobs:
