# Turbo Kart Grand Prix — cohesive low-poly asset set generated with Tripo (tripo-p1).
# Run:  tripo batch run tripo-assets.yaml --concurrency 3 --retries 1
# Shared style suffix keeps every asset in the same visual family; face budgets keep files light.
concurrency: 3
defaults:
  out: ./tripo-out
  params:
    negative_prompt: "realistic, photorealistic, text, letters, logo, watermark, multiple objects, base, ground plane, background"
jobs:
  - name: kart_wheel
    input: "a single stylized low poly racing kart wheel, black rubber tire with chunky tread, gold five-spoke rim with a hub cap, upright, stylized cartoon low poly game asset, Mario Kart inspired, clean smooth surfaces, flat bright colors, single object centered"
    params: { face_limit: 1500 }
  - name: driver
    input: "a stylized low poly kart driver character in a seated driving pose, knees bent, both arms stretched forward holding a small black steering wheel, plain white racing suit, white round helmet with a dark tinted visor, white gloves, chibi proportions, stylized cartoon low poly game asset, Mario Kart inspired, clean smooth surfaces, flat bright colors, single object centered"
    params: { face_limit: 4000 }
