    input: "a stylized low poly pine tree, three stacked conical layers of bright green foliage, short brown trunk, stylized cartoon low poly game asset, Mario Kart inspired, clean smooth surfaces, flat bright colors, single object centered"
    params: { face_limit: 900 }
  - name: tree_round
